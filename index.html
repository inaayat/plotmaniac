<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plotmaniac — Coming Soon</title>
    <meta name="description" content="Plotmaniac is coming soon." />
    <meta name="theme-color" content="#0c0b09" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0b09;
        --ink: #f4efe6;
        --muted: #9b9488;
        --gold: #e8c47a;
        --line: rgba(244, 239, 230, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        color: var(--ink);
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(ellipse at center, black 20%, transparent 72%);
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(720px, calc(100% - 48px));
        text-align: center;
        padding: 48px 0;
      }

      .mark {
        width: min(420px, 88vw);
        height: auto;
        margin: 0 auto 36px;
        display: block;
      }

      .mark path.arc {
        fill: none;
        stroke: var(--gold);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 640;
        stroke-dashoffset: 640;
        animation: draw 1.8s ease-out forwards;
      }

      .mark circle {
        fill: var(--gold);
        opacity: 0;
        animation: appear 0.4s ease-out 1.5s forwards;
      }

      p.status {
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 18px;
      }

      h1 {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: clamp(3rem, 12vw, 5.5rem);
        letter-spacing: -0.04em;
        line-height: 0.92;
        margin-bottom: 18px;
      }

      p.lede {
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.7;
        max-width: 42ch;
        margin: 0 auto;
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes appear {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark path.arc,
        .mark circle {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">Coming soon</p>
      <h1>Plotmaniac</h1>
      <svg class="mark" viewBox="0 0 420 88" role="img" aria-hidden="true">
        <path
          class="arc"
          d="M8 70 C 70 70, 92 62, 126 48 S 186 18, 214 14 S 268 22, 302 40 S 368 70, 412 70"
        />
        <circle cx="8" cy="70" r="3.5" />
        <circle cx="214" cy="14" r="3.5" />
        <circle cx="412" cy="70" r="3.5" />
      </svg>
      <p class="lede">A new site is in the works.<br />Check back soon.</p>
    </main>
  </body>
</html>
