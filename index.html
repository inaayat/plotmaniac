<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plotted</title>
    <meta name="description" content="A daily logic grid. Same puzzle for everyone." />
    <meta name="theme-color" content="#0c0b09" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="plotted.css" />
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.has("plot")) {
          var dest = new URL("archive/", location.href);
          dest.search = location.search;
          dest.hash = location.hash;
          location.replace(dest.href);
          return;
        }
        var key = "plotted-theme";
        var saved = null;
        try {
          saved = localStorage.getItem(key);
        } catch (e) {}
        var theme =
          saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f4efe6" : "#0c0b09");
      })();
    </script>
  </head>
  <body>
    <div class="shell">
      <header class="mast">
        <div class="mast-row">
          <p class="eyebrow" id="game-eyebrow">Daily logic grid</p>
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle color theme"></button>
        </div>
        <h1 id="game-title">Plotted</h1>
        <svg class="mark" viewBox="0 9 420 67" role="img" aria-hidden="true">
          <path
            class="arc"
            d="M8 70 C 70 70, 92 62, 126 48 S 186 18, 214 14 S 268 22, 302 40 S 368 70, 412 70"
          />
          <circle cx="8" cy="70" r="3.5" />
          <circle cx="214" cy="14" r="3.5" />
          <circle cx="412" cy="70" r="3.5" />
        </svg>
        <p class="lede" id="game-lede"></p>
        <p class="question" id="game-question"></p>
        <p class="meta">
          <span id="meta-date"></span>
          <span id="meta-timer"></span>
          <span id="meta-streak"></span>
        </p>
        <div class="actions">
          <button type="button" id="btn-hint">Hint</button>
          <button type="button" id="btn-check">Check</button>
          <button type="button" id="btn-share" hidden>Share</button>
        </div>
      </header>
      <main class="board" id="board">
        <p class="empty" id="boot">Loading today’s grid…</p>
      </main>
      <footer class="site-footer">
        <p><a id="archive-link" href="./archive/">Plotmaniac archive</a></p>
      </footer>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="win" id="win" hidden>
      <div class="win-card">
        <h2 id="win-title">Plotted</h2>
        <p class="lede" id="win-lede"></p>
        <pre id="share-text"></pre>
        <div class="actions">
          <button type="button" id="win-share">Copy result</button>
          <button type="button" id="win-close">Keep looking</button>
        </div>
      </div>
    </div>
    <script type="module" src="./plotted.js"></script>
  </body>
</html>
