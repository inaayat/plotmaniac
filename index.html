<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plotted</title>
    <meta name="description" content="A daily logic grid. Same puzzle for everyone." />
    <meta name="theme-color" content="#0c0b09" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="plotted.css" />
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.has("plot")) {
          var dest = new URL("archive/", location.href);
          dest.search = location.search;
          dest.hash = location.hash;
          location.replace(dest.href);
          return;
        }
        var key = "plotted-theme";
        var saved = null;
        try {
          saved = localStorage.getItem(key);
        } catch (e) {}
        var theme =
          saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f4efe6" : "#0c0b09");
      })();
    </script>
  </head>
  <body>
    <div class="shell">
      <header class="mast">
        <div class="mast-bar">
          <p class="eyebrow" id="game-eyebrow">Daily logic grid</p>
          <h1 id="game-title">Plotted</h1>
          <div class="mast-tools">
            <button type="button" class="icon-btn" id="btn-hint" aria-label="Reveal a cell"></button>
            <button type="button" class="icon-btn" id="btn-check" aria-label="Check the grid"></button>
            <button type="button" class="icon-btn" id="btn-share" aria-label="Share result" hidden></button>
            <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle color theme"></button>
          </div>
        </div>
        <p class="question" id="game-question"></p>
        <p class="lede" id="game-lede"></p>
        <p class="meta">
          <span id="meta-date"></span>
          <span id="meta-timer"></span>
          <span id="meta-streak"></span>
        </p>
      </header>
      <main class="board" id="board">
        <p class="empty" id="boot">Loading today’s grid…</p>
      </main>
      <footer class="site-footer">
        <p><a id="archive-link" href="./archive/">Plotmaniac archive</a></p>
      </footer>
    </div>
    <div class="sheet" id="sheet" hidden>
      <button type="button" class="sheet-backdrop" id="sheet-dismiss" aria-label="Close picker"></button>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-label">
        <div class="sheet-head">
          <p class="tray-label" id="sheet-label"></p>
          <button type="button" class="icon-btn" id="sheet-close" aria-label="Close picker"></button>
        </div>
        <div class="tray-items" id="sheet-items"></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="win" id="win" hidden>
      <div class="win-card">
        <h2 id="win-title">Plotted</h2>
        <p class="lede" id="win-lede"></p>
        <pre id="share-text"></pre>
        <div class="actions">
          <button type="button" id="win-share">Copy result</button>
          <button type="button" id="win-close">Keep looking</button>
        </div>
      </div>
    </div>
    <script type="module" src="./plotted.js"></script>
  </body>
</html>
