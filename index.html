<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plotmaniac</title>
    <meta
      name="description"
      content="Plotmaniac is a field guide to a person, a country, or the wars map: friends and foes, a timeline, or which countries are fighting."
    />
    <meta name="theme-color" content="#0c0b09" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lore.css" />
    <link rel="stylesheet" href="partition.css" />
  </head>
  <body data-view="pick">
    <header class="mast">
      <button type="button" class="status" id="home-link">Field guide</button>
      <h1 id="plot-title">Plotmaniac</h1>
      <svg class="mark" viewBox="0 0 420 88" role="img" aria-hidden="true">
        <path
          class="arc"
          d="M8 70 C 70 70, 92 62, 126 48 S 186 18, 214 14 S 268 22, 302 40 S 368 70, 412 70"
        />
        <circle cx="8" cy="70" r="3.5" />
        <circle cx="214" cy="14" r="3.5" />
        <circle cx="412" cy="70" r="3.5" />
      </svg>
      <p class="lede" id="plot-lede">Pick a person, a country, a history, or the map of wars.</p>
      <nav class="views" aria-label="Plot and views">
        <label class="plot-switch">
          <span>Plot</span>
          <select id="plot-select"></select>
        </label>
        <label class="plot-switch" id="hub-switch" hidden>
          <span>Focus</span>
          <select id="hub-select"></select>
        </label>
        <button type="button" id="view-web" data-view="web">The web</button>
        <button type="button" id="view-timeline" data-view="timeline">Full timeline</button>
      </nav>
    </header>

    <main id="app" class="app">
      <p class="loading"><span class="loading-dot"></span>Drawing the web…</p>
    </main>

    <footer class="site-footer">
      <p id="footer-note">Plotmaniac</p>
      <details id="credits" class="credits">
        <summary>Image credits</summary>
        <ul id="credit-list"></ul>
      </details>
    </footer>

    <div class="toast" id="share-toast" role="status" aria-live="polite" hidden>Link copied.</div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
